server:
  port: 8081
  servlet:
    context-path: "/api"
spring:
  cloud:
    discovery:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: bookingHouse

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      bookingImage:
        register-health-indicator: true

langchain4j:
  google:
    api-key: "${GOOGLE_API_KEY}"  # Remplacez par votre clé API Google
    model-name: "gemini-1.5-flash"

logging:
  level:
    dev:
      langchain4j: DEBUG
      ai4j:
        openai4j: DEBUG
    ai:
      djl: OFF